<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraSys E-Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold text-indigo-600">📚 LibraSys E-Library</h1>
    <button onclick="toggleLogin()" id="btnLogin" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm">Login Petugas</button>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto p-6 space-y-6">
    
    <!-- Form Peminjaman (Hanya muncul jika login) -->
    <div id="adminPanel" class="hidden bg-white p-6 rounded-xl shadow-sm border">
      <h2 class="text-lg font-bold mb-4">Panel Petugas (Peminjaman)</h2>
      <form onsubmit="pinjamBuku(event)" class="flex gap-4">
        <select id="pilihBuku" class="border p-2 rounded-lg w-full" required>
          <!-- Opsi buku diisi via JS -->
        </select>
        <input type="text" id="namaPeminjam" placeholder="Nama Peminjam" class="border p-2 rounded-lg w-full" required>
        <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded-lg">Pinjam</button>
      </form>
      <div id="statusPinjam" class="mt-4 text-sm text-emerald-600 font-bold"></div>
    </div>

    <!-- Katalog Buku -->
    <h2 class="text-2xl font-bold">Katalog Buku</h2>
    <div id="katalog" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
      <!-- Kartu buku diisi via JS -->
    </div>

  </main>

  <script>
    // Data buku disesuaikan dengan file PDF di folder ebook Anda
    const daftarBuku = [
      { judul: "Ada Cinta di SMA CJR", file: "Ada_Cinta_di_SMA_CJR.pdf", warna: "bg-pink-100" },
      { judul: "Ayat-Ayat Api", file: "Ayat_ayat_api.pdf", warna: "bg-rose-100" },
      { judul: "Bahagia Kenapa Tidak", file: "Bahagia_kenapa_tidak.pdf", warna: "bg-amber-100" },
      { judul: "Buku Islam Agamaku", file: "Buku_islam_agamaku.pdf", warna: "bg-emerald-100" },
      { judul: "Bumi Tere Liye", file: "Bumi_Tere_liye.pdf", warna: "bg-blue-100" },
      { judul: "Dilan", file: "Dilan.pdf", warna: "bg-indigo-100" }
    ];

    // Render Katalog
    const katalog = document.getElementById('katalog');
    daftarBuku.forEach(buku => {
      katalog.innerHTML += `
        <div class="bg-white p-4 rounded-xl shadow-sm border hover:shadow-md transition">
          <div class="${buku.warna} h-32 rounded-lg mb-3 flex items-center justify-center p-2 text-center">
            <span class="font-bold text-gray-700">${buku.judul}</span>
          </div>
          <h3 class="font-bold text-gray-900 line-clamp-2">${buku.judul}</h3>
          <p class="text-xs text-gray-500 mb-4 truncate">📄 ${buku.file}</p>
          <a href="ebook/${buku.file}" target="_blank" class="block text-center w-full bg-indigo-600 text-white py-2 rounded-lg text-sm hover:bg-indigo-700">
            📖 Baca Ebook
          </a>
        </div>
      `;
      
      // Isi dropdown form peminjaman
      document.getElementById('pilihBuku').innerHTML += `<option value="${buku.judul}">${buku.judul}</option>`;
    });

    // Logika Login
    let isLogin = false;
    function toggleLogin() {
      if (!isLogin) {
        let user = prompt("Masukkan Username (admin):");
        let pass = prompt("Masukkan Password (admin123):");
        if (user === "admin" && pass === "admin123") {
          isLogin = true;
          document.getElementById('adminPanel').classList.remove('hidden');
          document.getElementById('btnLogin').innerText = "Logout";
          document.getElementById('btnLogin').classList.replace('bg-indigo-600', 'bg-red-500');
        } else {
          alert("Username atau Password salah!");
        }
      } else {
        isLogin = false;
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('btnLogin').innerText = "Login Petugas";
        document.getElementById('btnLogin').classList.replace('bg-red-500', 'bg-indigo-600');
      }
    }

    // Logika Pinjam Buku
    function pinjamBuku(e) {
      e.preventDefault();
      let buku = document.getElementById('pilihBuku').value;
      let nama = document.getElementById('namaPeminjam').value;
      document.getElementById('statusPinjam').innerText = `✅ Berhasil! "${buku}" dipinjam oleh ${nama}.`;
      document.getElementById('namaPeminjam').value = "";
    }
  </script>
</body>
</html>
