<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraSys - Aplikasi Otomasi Perpustakaan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    .barcode { background: repeating-linear-gradient(90deg, #000 0px, #000 2px, transparent 2px, transparent 4px); height: 40px; }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="text-slate-800 h-screen flex overflow-hidden">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="w-64 bg-indigo-900 text-white flex flex-col hidden md:flex no-print">
    <div class="h-16 flex items-center px-6 border-b border-indigo-800">
      <span class="text-xl font-bold">📚 LibraSys</span>
    </div>
    <nav class="flex-1 px-4 py-6 space-y-2">
      <button onclick="switchTab('opac')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg bg-indigo-800 font-medium">🔍 OPAC Pencarian</button>
      <button onclick="switchTab('biblio')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg hover:bg-indigo-800 text-indigo-200">📖 Bibliografi</button>
      <button onclick="switchTab('member')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg hover:bg-indigo-800 text-indigo-200">👥 Keanggotaan</button>
      <button onclick="switchTab('sirkulasi')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg hover:bg-indigo-800 text-indigo-200">🔄 Sirkulasi & Denda</button>
      <button onclick="switchTab('pengaturan')" class="nav-btn w-full text-left px-4 py-2.5 rounded-lg hover:bg-indigo-800 text-indigo-200">⚙️ Pengaturan Akun</button>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
    
    <!-- TOPBAR -->
    <header class="h-16 bg-white shadow-sm flex items-center justify-between px-6 z-10 no-print">
      <div class="flex items-center gap-4">
        <h2 id="pageTitle" class="text-lg font-bold text-slate-700">OPAC Pencarian</h2>
      </div>
      <div class="flex items-center gap-4">
        <span id="userStatus" class="text-sm font-medium text-slate-500">Mode Pengunjung</span>
        <button id="btnLoginToggle" onclick="toggleLogin()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Login Petugas</button>
      </div>
    </header>

    <!-- CONTENT AREA -->
    <div class="flex-1 overflow-y-auto p-6 space-y-6">
      
      <!-- ================= TAB OPAC ================= -->
      <div id="tab-opac" class="tab-content space-y-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
          <h3 class="font-bold text-lg mb-4">Pencarian Katalog (OPAC)</h3>
          <div class="flex flex-col md:flex-row gap-4">
            <input type="text" id="searchQuery" oninput="renderOPAC()" placeholder="Cari judul atau pengarang..." class="flex-1 border border-slate-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
            <select id="searchCategory" onchange="renderOPAC()" class="border border-slate-300 rounded-lg p-2.5 bg-white outline-none">
              <option value="all">Semua Kategori</option>
              <option value="Fiksi & Novel">Fiksi & Novel</option>
              <option value="Religi">Religi</option>
              <option value="Sosial">Sosial</option>
            </select>
          </div>
        </div>
        <div id="opacGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
      </div>

      <!-- ================= TAB BIBLIOGRAFI ================= -->
      <div id="tab-biblio" class="tab-content hidden space-y-6">
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
          <h3 class="font-bold text-lg">Manajemen Buku</h3>
          <button onclick="openModal('modalBook')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm">+ Tambah Buku</button>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 border-b border-slate-200">
              <tr>
                <th class="p-4 font-semibold text-slate-600">Judul</th>
                <th class="p-4 font-semibold text-slate-600">File PDF</th>
                <th class="p-4 font-semibold text-slate-600">Stok</th>
                <th class="p-4 font-semibold text-slate-600 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="biblioTable" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

      <!-- ================= TAB ANGGOTA ================= -->
      <div id="tab-member" class="tab-content hidden space-y-6">
        <div class="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
          <h3 class="font-bold text-lg">Data Keanggotaan</h3>
          <button onclick="openModal('modalMember')" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm">+ Tambah Anggota</button>
        </div>
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 border-b border-slate-200">
              <tr>
                <th class="p-4 font-semibold text-slate-600">ID</th>
                <th class="p-4 font-semibold text-slate-600">Nama</th>
                <th class="p-4 font-semibold text-slate-600">Status</th>
                <th class="p-4 font-semibold text-slate-600 text-right">Aksi</th>
              </tr>
            </thead>
            <tbody id="memberTable" class="divide-y divide-slate-100"></tbody>
          </table>
        </div>
      </div>

      <!-- ================= TAB SIRKULASI ================= -->
      <div id="tab-sirkulasi" class="tab-content hidden space-y-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-1 h-fit">
            <h3 class="font-bold text-lg mb-4">Peminjaman Baru</h3>
            <form onsubmit="pinjamBuku(event)" class="space-y-4">
              <select id="pinjamAnggota" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white"></select>
              <select id="pinjamBukuId" required class="w-full border border-slate-300 rounded-lg p-2.5 bg-white"></select>
              <div class="grid grid-cols-2 gap-2">
                <input type="date" id="tglPinjam" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
                <input type="date" id="tglKembali" required class="w-full border border-slate-300 rounded-lg p-2.5 text-sm">
              </div>
              <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-lg font-medium">Proses Peminjaman</button>
            </form>
          </div>
          <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-2">
            <h3 class="font-bold text-lg mb-4">Daftar Transaksi</h3>
            <div id="sirkulasiList" class="space-y-3"></div>
          </div>
        </div>
      </div>

      <!-- ================= TAB PENGATURAN ================= -->
      <div id="tab-pengaturan" class="tab-content hidden space-y-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 max-w-xl">
          <h3 class="font-bold text-lg mb-4">Ganti Password</h3>
          <form onsubmit="gantiPassword(event)" class="space-y-4">
            <div>
              <label class="block text-sm text-slate-600 mb-1">Password Lama</label>
              <input type="password" id="oldPass" required class="w-full border border-slate-300 rounded-lg p-2.5">
            </div>
            <div>
              <label class="block text-sm text-slate-600 mb-1">Password Baru</label>
              <input type="password" id="newPass" required class="w-full border border-slate-300 rounded-lg p-2.5">
            </div>
            <button type="submit" class="bg-slate-800 text-white px-6 py-2.5 rounded-lg">Simpan Perubahan</button>
          </form>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 max-w-xl">
          <h3 class="font-bold text-lg mb-4">Tambah Username Petugas</h3>
          <form onsubmit="tambahUser(event)" class="space-y-4">
            <input type="text" id="newUser" required placeholder="Username Baru" class="w-full border border-slate-300 rounded-lg p-2.5">
            <input type="password" id="newUserPass" required placeholder="Password" class="w-full border border-slate-300 rounded-lg p-2.5">
            <button type="submit" class="bg-emerald-600 text-white px-6 py-2.5 rounded-lg">Tambah User</button>
          </form>
        </div>
      </div>

    </div>
  </main>

  <!-- ================= MODALS ================= -->
  
  <!-- Modal Login -->
  <div id="modalLogin" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl w-96 shadow-xl">
      <h3 class="font-bold text-lg mb-4">Login Petugas</h3>
      <form onsubmit="prosesLogin(event)" class="space-y-4">
        <input type="text" id="logUser" placeholder="Username (admin)" required class="w-full border p-2.5 rounded-lg">
        <input type="password" id="logPass" placeholder="Password (admin123)" required class="w-full border p-2.5 rounded-lg">
        <div class="flex gap-2 justify-end">
          <button type="button" onclick="closeModal('modalLogin')" class="px-4 py-2 text-slate-500">Batal</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">Masuk</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Tambah Buku -->
  <div id="modalBook" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl w-[500px] shadow-xl">
      <h3 class="font-bold text-lg mb-4">Tambah Buku Baru</h3>
      <form onsubmit="simpanBuku(event)" class="space-y-3">
        <input type="text" id="inJudul" placeholder="Judul Buku" required class="w-full border p-2 rounded-lg">
        <input type="text" id="inPengarang" placeholder="Pengarang" required class="w-full border p-2 rounded-lg">
        <input type="text" id="inFile" placeholder="Nama File (contoh: buku_baru.pdf)" required class="w-full border p-2 rounded-lg">
        <input type="number" id="inStok" placeholder="Stok Awal" required class="w-full border p-2 rounded-lg">
        <div class="flex gap-2 justify-end mt-4">
          <button type="button" onclick="closeModal('modalBook')" class="px-4 py-2 text-slate-500">Batal</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">Simpan Buku</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Tambah Anggota -->
  <div id="modalMember" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white p-6 rounded-xl w-96 shadow-xl">
      <h3 class="font-bold text-lg mb-4">Tambah Anggota</h3>
      <form onsubmit="simpanAnggota(event)" class="space-y-3">
        <input type="text" id="inMemberId" placeholder="ID Anggota (contoh: AGT-01)" required class="w-full border p-2 rounded-lg">
        <input type="text" id="inMemberName" placeholder="Nama Lengkap" required class="w-full border p-2 rounded-lg">
        <div class="flex gap-2 justify-end mt-4">
          <button type="button" onclick="closeModal('modalMember')" class="px-4 py-2 text-slate-500">Batal</button>
          <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Print Area -->
  <div id="modalPrint" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 no-print">
    <div class="bg-white p-6 rounded-xl w-[600px] shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-lg">Pratinjau Cetak</h3>
        <button onclick="window.print()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm">🖨️ Cetak</button>
      </div>
      <div id="printArea" class="border p-6 rounded-lg bg-slate-50"></div>
      <button onclick="closeModal('modalPrint')" class="mt-4 w-full border py-2 rounded-lg text-slate-600">Tutup</button>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    // ================= DATA DUMMY =================
    let books = [
      { id: 1, title: 'Ada Cinta di SMA CJR', author: 'CJR', file: 'Ada_Cinta_di_SMA_CJR.pdf', category: 'Fiksi & Novel', stock: 3, isbn: '111' },
      { id: 2, title: 'Ayat-Ayat Api', author: 'Penulis', file: 'Ayat_ayat_api.pdf', category: 'Fiksi & Novel', stock: 2, isbn: '222' },
      { id: 3, title: 'Bahagia Kenapa Tidak', author: 'Penulis', file: 'Bahagia_kenapa_tidak.pdf', category: 'Sosial', stock: 4, isbn: '333' },
      { id: 4, title: 'Buku Islam Agamaku', author: 'Penulis', file: 'Buku_islam_agamaku.pdf', category: 'Religi', stock: 5, isbn: '444' },
      { id: 5, title: 'Bumi Tere Liye', author: 'Tere Liye', file: 'Bumi_Tere_liye.pdf', category: 'Fiksi & Novel', stock: 3, isbn: '555' },
      { id: 6, title: 'Dilan', author: 'Pidi Baiq', file: 'Dilan.pdf', category: 'Fiksi & Novel', stock: 4, isbn: '666' }
    ];
    let members = [
      { id: 'AGT-01', name: 'Nadia', status: 'Aktif' },
      { id: 'AGT-02', name: 'Dimas', status: 'Aktif' }
    ];
    let loans = [];
    let users = [{ u: 'admin', p: 'admin123' }];
    let currentUser = null;

    const dendaPerHari = 1000;

    // ================= NAVIGATION =================
    function switchTab(tab) {
      if (tab !== 'opac' && !currentUser) {
        alert('Silakan login sebagai petugas terlebih dahulu!');
        openModal('modalLogin');
        return;
      }
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + tab).classList.remove('hidden');
      
      document.querySelectorAll('.nav-btn').forEach(el => {
        el.classList.remove('bg-indigo-800', 'font-medium');
        el.classList.add('text-indigo-200');
      });
      event.target.classList.remove('text-indigo-200');
      event.target.classList.add('bg-indigo-800', 'font-medium');

      const titles = { opac: 'OPAC Pencarian', biblio: 'Manajemen Bibliografi', member: 'Data Keanggotaan', sirkulasi: 'Sirkulasi & Denda', pengaturan: 'Pengaturan Akun' };
      document.getElementById('pageTitle').innerText = titles[tab];
    }

    // ================= AUTH =================
    function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

    function toggleLogin() {
      if (currentUser) {
        currentUser = null;
        updateAuthUI();
        switchTab('opac');
      } else {
        openModal('modalLogin');
      }
    }

    function prosesLogin(e) {
      e.preventDefault();
      let u = document.getElementById('logUser').value;
      let p = document.getElementById('logPass').value;
      let found = users.find(x => x.u === u && x.p === p);
      if (found) {
        currentUser = found.u;
        closeModal('modalLogin');
        updateAuthUI();
        alert('Login Berhasil!');
      } else {
        alert('Username atau Password salah!');
      }
    }

    function updateAuthUI() {
      if (currentUser) {
        document.getElementById('userStatus').innerText = 'Petugas: ' + currentUser;
        document.getElementById('btnLoginToggle').innerText = 'Logout';
        document.getElementById('btnLoginToggle').className = 'bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition';
      } else {
        document.getElementById('userStatus').innerText = 'Mode Pengunjung';
        document.getElementById('btnLoginToggle').innerText = 'Login Petugas';
        document.getElementById('btnLoginToggle').className = 'bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition';
      }
    }

    function gantiPassword(e) {
      e.preventDefault();
      let old = document.getElementById('oldPass').value;
      let baru = document.getElementById('newPass').value;
      let userObj = users.find(x => x.u === currentUser);
      if (userObj.p === old) {
        userObj.p = baru;
        alert('Password berhasil diubah!');
        e.target.reset();
      } else {
        alert('Password lama salah!');
      }
    }

    function tambahUser(e) {
      e.preventDefault();
      let nu = document.getElementById('newUser').value;
      let np = document.getElementById('newUserPass').value;
      if (users.find(x => x.u === nu)) return alert('Username sudah dipakai!');
      users.push({ u: nu, p: np });
      alert('User baru berhasil ditambahkan!');
      e.target.reset();
    }

    // ================= OPAC =================
    function renderOPAC() {
      let q = document.getElementById('searchQuery').value.toLowerCase();
      let c = document.getElementById('searchCategory').value;
      
      let filtered = books.filter(b => {
        let matchQ = b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q);
        let matchC = c === 'all' || b.category === c;
        return matchQ && matchC;
      });

      document.getElementById('opacGrid').innerHTML = filtered.map(b => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
          <div class="h-40 bg-indigo-100 flex items-center justify-center p-4">
            <span class="text-center font-bold text-indigo-900">${b.title}</span>
          </div>
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h4 class="font-bold text-lg leading-tight mb-1">${b.title}</h4>
              <p class="text-sm text-slate-500 mb-2">${b.author}</p>
              <span class="text-xs bg-slate-100 px-2 py-1 rounded">${b.category}</span>
            </div>
            <div class="mt-4">
              <a href="ebook/${b.file}" target="_blank" class="block text-center w-full bg-indigo-50 text-indigo-700 font-medium py-2 rounded-lg hover:bg-indigo-100">📖 Baca Ebook</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ================= BIBLIOGRAFI =================
    function renderBiblio() {
      document.getElementById('biblioTable').innerHTML = books.map(b => `
        <tr>
          <td class="p-4 font-medium">${b.title}</td>
          <td class="p-4 font-mono text-xs text-slate-500">${b.file}</td>
          <td class="p-4 font-bold text-emerald-600">${b.stock}</td>
          <td class="p-4 text-right">
            <button onclick="cetakBarcode('${b.title}', '${b.isbn}')" class="text-indigo-600 hover:bg-indigo-50 px-2 py-1 rounded">🏷️ Barcode</button>
            <button onclick="hapusBuku(${b.id})" class="text-rose-600 hover:bg-rose-50 px-2 py-1 rounded">Hapus</button>
          </td>
        </tr>
      `).join('');
    }

    function simpanBuku(e) {
      e.preventDefault();
      books.push({
        id: Date.now(),
        title: document.getElementById('inJudul').value,
        author: document.getElementById('inPengarang').value,
        file: document.getElementById('inFile').value,
        stock: parseInt(document.getElementById('inStok').value),
        category: 'Fiksi & Novel', isbn: '000'
      });
      closeModal('modalBook');
      renderBiblio();
      renderOPAC();
      e.target.reset();
    }

    function hapusBuku(id) {
      if(confirm('Hapus buku ini?')) {
        books = books.filter(b => b.id !== id);
        renderBiblio(); renderOPAC();
      }
    }

    // ================= ANGGOTA =================
    function renderMember() {
      document.getElementById('memberTable').innerHTML = members.map(m => `
        <tr>
          <td class="p-4 font-mono text-indigo-600">${m.id}</td>
          <td class="p-4 font-medium">${m.name}</td>
          <td class="p-4"><span class="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs">${m.status}</span></td>
          <td class="p-4 text-right">
            <button onclick="cetakKartu('${m.id}', '${m.name}')" class="text-indigo-600 hover:bg-indigo-50 px-2 py-1 rounded">🪪 Kartu</button>
          </td>
        </tr>
      `).join('');
    }

    function simpanAnggota(e) {
      e.preventDefault();
      members.push({
        id: document.getElementById('inMemberId').value,
        name: document.getElementById('inMemberName').value,
        status: 'Aktif'
      });
      closeModal('modalMember');
      renderMember();
      e.target.reset();
    }

    // ================= SIRKULASI =================
    function renderSirkulasi() {
      document.getElementById('pinjamAnggota').innerHTML = members.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
      document.getElementById('pinjamBukuId').innerHTML = books.filter(b => b.stock > 0).map(b => `<option value="${b.id}">${b.title} (Stok: ${b.stock})</option>`).join('');

      document.getElementById('sirkulasiList').innerHTML = loans.map((l, index) => {
        let b = books.find(x => x.id === l.bookId);
        let m = members.find(x => x.id === l.memberId);
        
        let statusHtml = l.status === 'Dipinjam' 
          ? `<button onclick="kembalikanBuku(${index})" class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded text-xs font-bold">Kembalikan</button>`
          : `<span class="text-xs text-slate-500 font-bold">Selesai (Denda: Rp ${l.denda})</span>`;

        return `
          <div class="flex justify-between items-center p-3 border rounded-lg bg-slate-50">
            <div>
              <div class="font-bold text-sm">${b ? b.title : 'Buku Dihapus'}</div>
              <div class="text-xs text-slate-500">Peminjam: ${m ? m.name : '-'} | Tgl: ${l.tgl}</div>
            </div>
            ${statusHtml}
          </div>
        `;
      }).join('');
    }

    function pinjamBuku(e) {
      e.preventDefault();
      let bId = parseInt(document.getElementById('pinjamBukuId').value);
      let mId = document.getElementById('pinjamAnggota').value;
      let tgl = document.getElementById('tglPinjam').value;
      
      let book = books.find(b => b.id === bId);
      if(book.stock > 0) {
        book.stock -= 1; // Stok berkurang
        loans.push({ bookId: bId, memberId: mId, tgl: tgl, status: 'Dipinjam', denda: 0 });
        alert('Peminjaman berhasil! Stok berkurang.');
        renderSirkulasi();
        renderBiblio();
      }
    }

    function kembalikanBuku(index) {
      let loan = loans[index];
      let book = books.find(b => b.id === loan.bookId);
      
      // Simulasi hitung denda (misal pinjam 5 hari lalu, batas 3 hari = terlambat 2 hari)
      // Untuk demo, kita asumsikan terlambat 2 hari
      let hariTerlambat = 2; 
      let denda = hariTerlambat * dendaPerHari;

      book.stock += 1; // Stok bertambah
      loan.status = 'Dikembalikan';
      loan.denda = denda;

      alert(`Buku dikembalikan. Terlambat ${hariTerlambat} hari. Denda: Rp ${denda}`);
      renderSirkulasi();
      renderBiblio();
    }

    // ================= CETAK (PRINT) =================
    function cetakBarcode(judul, isbn) {
      document.getElementById('printArea').innerHTML = `
        <div class="border-2 border-black p-4 text-center max-w-xs mx-auto">
          <h4 class="font-bold text-sm mb-2">${judul}</h4>
          <div class="barcode w-full mb-2"></div>
          <p class="font-mono text-xs">ISBN: ${isbn}</p>
        </div>
      `;
      openModal('modalPrint');
    }

    function cetakKartu(id, nama) {
      document.getElementById('printArea').innerHTML = `
        <div class="border-2 border-indigo-600 rounded-xl overflow-hidden max-w-sm mx-auto">
          <div class="bg-indigo-600 text-white p-3 text-center">
            <h4 class="font-bold">KARTU ANGGOTA PERPUSTAKAAN</h4>
          </div>
          <div class="p-4">
            <p class="text-xs text-slate-500">Nama Lengkap:</p>
            <h5 class="font-bold text-lg mb-2">${nama}</h5>
            <p class="text-xs text-slate-500">ID Anggota:</p>
            <p class="font-mono font-bold mb-4">${id}</p>
            <div class="barcode w-full"></div>
          </div>
        </div>
      `;
      openModal('modalPrint');
    }

    // ================= INIT =================
    renderOPAC();
    renderBiblio();
    renderMember();
    renderSirkulasi();
    updateAuthUI();

  </script>
</body>
